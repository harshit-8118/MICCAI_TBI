paths:
  dataset_dir: "/data/data/DA25S005/miccai_tbi/MultiTalentV2_finetuning/MICCAI_AIMS_TBI"
  pretrained_checkpoint: "/data/data/DA25S005/miccai_tbi/MultiTalentV2_finetuning/MultiTalentV2_pretrained/Dataset617_nativect/MultiTalent_trainer_4000ep__nnUNetResEncUNetL1x1x1_Plans_znorm_bs24__3d_fullres/fold_all/checkpoint_final.pth"
  pretrained_plans: "/data/data/DA25S005/miccai_tbi/MultiTalentV2_finetuning/MultiTalentV2_pretrained/Dataset617_nativect/MultiTalent_trainer_4000ep__nnUNetResEncUNetL1x1x1_Plans_znorm_bs24__3d_fullres/fold_all/nnUNetResEncUNetL1x1x1_Plans_znorm_bs24.json"
  work_dir: "checkpoints/tbi_multitalentv2"
  cache_dir: "checkpoints/cache"
  splits_file: "checkpoints/tbi_splits_5fold.json"
  predictions_dir: "predictions"

data:
  target_spacing: [1.0, 1.0, 1.0]
  patch_size: [192, 192, 192]
  input_modalities: ["T1"]
  include_dmri: false
  dmri_reduce: "mean"
  dmri_b0_threshold: 50.0
  allow_missing_modalities: true
  normalize_foreground_only: true
  cache_preprocessed: true
  oversample_foreground_prob: 0.66 # increased from 0.33

model:
  in_channels: 1
  out_channels: 2
  deep_supervision: false # keep it false anyhow, 
  load_pretrained: true
  strict_load: false
  skip_pretrained_name_patterns: ["seg", "final", "classifier", "output"]

training:
  seed: 42
  num_folds: 5
  fold: 1
  batch_size: 1 # 1 or 2
  num_workers: 16
  prefetch_factor: 4
  max_epochs: 50
  base_lr: 0.001
  weight_decay: 0.00001
  poly_power: 0.9
  warmup_epochs: 10
  use_amp: true
  optimizer: "adamw"
  loss: "dice_ce"
  class_weights: [1.0, 2.0]
  metric_threshold: 0.5
  grad_clip_norm: 8.0
  save_every_epoch: false
  validation_interval_epochs: 1
  final_validation: false
  best_checkpoint_metric: "val_dice"
  best_checkpoint_mode: "max"
  min_lr: 0.00000001
  head_warmup_epochs: 10
  partial_warmup_epochs: 5
  full_warmup_epochs: 2
  case_sampling:
    enabled: false
    positive_fraction: 0.65
    epoch_length_multiplier: 1.0
    size_weights:
      empty: 1.0
      tiny:  3.0
      small: 2.0
      large: 1.5
    replacement: true
  staged_tuning:
    enabled: true
    head_only_epochs: 0
    partial_tune_epochs: 0
    head_lr: 0.001
    partial_lr: 0.0003 
    full_lr: 0.00001
    head_patterns: ["seg_layers", "seg", "final", "classifier", "output"]
    partial_patterns: ["decoder", "transpconvs", "seg_layers"]

segmenter_a:
  # Lesion-positive-focused second strategy.
  # Outputs go to: checkpoints/tbi_multitalentv2/segmenter_a/fold_X
  output_subdir: "segmenter_a"
  init_checkpoint: "checkpoints/trained_models/best_tr_f1_kpcyjb66.pt"
  filters_dir: "checkpoints/tbi_multitalentv2/case_filters"
  train_min_lesion_voxels: 1  # Use 1 for max sensitivity, 51 if very tiny masks look noisy
  val_min_lesion_voxels: 1
  selection_min_lesion_voxels: 50
  selection_metric: "dice_gt_over_selection_min"
  probability_threshold: 0.5  # Lower like 0.35–0.45 increases recall, higher like 0.55–0.65 reduces false positives
  min_component_voxels: 0   # Try 0, 5, 10, 25; be careful above 25 because true tiny lesions can die.
  epoch_length_multiplier: 1.0
  size_weights:
    very_tiny: 6.0
    tiny: 4.0
    small: 2.5
    large: 1.5
    empty: 1.0
  hard_negative:
    enabled: false
    empty_fraction: 0.15
    manifest_path: "checkpoints/tbi_multitalentv2/hard_negatives/fold_1/train_empty_fp_components.csv"
    center_sampling_prob: 0.85
    max_centers_per_case: 8

wandb:
  enabled: true
  project: "AIMS-TBI-MultiTalentV3" # Version3 is two stage training.
  entity: "da25s003-indian-institute-of-technology-madras"
  name: null
  mode: "online"
  tags: ["multitalentv2", "tbi", "fold", "lesion_focussed", "2stage"]
  notes: ""

inference:
  roi_size: [192, 192, 192]
  overlap: 0.5
  sw_batch_size: 2
  use_amp: true

ensemble:
  enabled: true
  output_name: "ensemble3_tta_f1_2"
  threshold: 0.10
  min_component_voxels: 0
  tta: "flips"
  load_mode: "preload"
  checkpoints:
    - "checkpoints/trained_models/best_tr_f1_kpcyjb66.pt"
    - "checkpoints/tbi_multitalentv2/segmenter_a/fold_1/best_tiny.pt"
    - "checkpoints/tbi_multitalentv2/segmenter_a/fold_1/best_gt50.pt"
    - "checkpoints/trained_models/best_714109.pt"
